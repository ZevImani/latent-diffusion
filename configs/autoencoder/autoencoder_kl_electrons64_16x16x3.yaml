model:
  base_learning_rate: 4.5e-6
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    monitor: "val/rec_loss"
    reuse_rec_for_disc: True ## disc step reuses AE-step reconstructions (no 2nd AE forward)
    embed_dim: 3
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_in_channels: 1 ## Specifiy data channels  
        disc_start: 500 ## when to turn discriminator on 
        kl_weight: 0.000001
        disc_weight: 0.5
        

    ddconfig:
      double_z: True
      z_channels: 3
      resolution: 64
      in_channels: 1  
      out_ch: 1 
      ch: 128
      ch_mult: [1, 2, 4]  # num_down = len(ch_mult)-1
      # ch_mult: [1, 2, 4, 8]  # num_down = len(ch_mult)-1 ## small: added 8
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

## Copied from autoencoder_kl_protons64_16x16x3.yaml (electrons dataset) 

## Input = 64x64x1 
## Latent = 16x16x3

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 256 ## full A100-80GB: ~65 GiB peak, ~99% GPU util (same effective batch as 128 x accumulate 2)
    wrap: True
    num_workers: 3 ## default is batch_size*2; 3 workers ~2000 img/s vs ~320 img/s needed; request -c 4
    train:
      target: ldm.data.protons64.electrons64Train
    validation:
      target: ldm.data.protons64.electrons64Validation

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: False 
    accumulate_grad_batches: 1 ## effective batch 256 -> scaled lr 1.15e-3, same as protons
    precision: 32 ## bf16 (7-bit mantissa) shifts trained-AE recos by ~56% of the AE error; fp16 overflows on raw MeV inputs. Convs still use TF32.
    max_epochs: 150 
    val_check_interval: 1000   ## Validation Frequency (in batches; 1000 batches/epoch at bs 256 -> once per epoch, ~40 s incl. ckpt save)
